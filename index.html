<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indovina la bandiera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#DDF1FF; --sky2:#BFE3FF; --ink:#1E2A4A; --paper:#FFFFFF;
  --sun:#FFC53D; --sun-dark:#E0A51F; --ok:#2EC27E; --ok-dark:#1E9C62;
  --no:#F2566B; --no-dark:#C83A4E; --muted:#6B7A99;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  font-family:"Nunito",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  font-weight:700;color:var(--ink);
  background:
    radial-gradient(circle at 15% 10%, #fff 0 60px, transparent 61px),
    radial-gradient(circle at 85% 85%, #fff 0 80px, transparent 81px),
    radial-gradient(circle at 70% 15%, #fff 0 40px, transparent 41px),
    linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);
  background-attachment:fixed;
  display:flex;flex-direction:column;align-items:center;
}
main{width:100%;max-width:520px;padding:16px 16px 32px;flex:1;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;gap:18px}
.screen.on{display:flex}

h1{font-weight:900;font-size:clamp(34px,9vw,46px);line-height:1;margin:28px 0 4px;text-align:center;letter-spacing:-.5px}
h1 span{display:inline-block;transform:rotate(-4deg);background:var(--sun);padding:2px 12px;border-radius:14px;box-shadow:0 6px 0 var(--sun-dark)}
h2{font-weight:900;font-size:22px;margin:8px 0 0;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0;font-size:15px}

.choices{display:grid;gap:12px}
.choices.two{grid-template-columns:1fr 1fr}
.pick{
  appearance:none;border:0;cursor:pointer;font:inherit;font-weight:900;color:var(--ink);
  background:var(--paper);border-radius:22px;padding:18px 14px;font-size:19px;
  box-shadow:0 6px 0 #C9DDF0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:transform .12s;
}
.pick:active{transform:translateY(4px);box-shadow:0 2px 0 #C9DDF0}
.pick .ico{font-size:40px;line-height:1}
.pick small{display:block;font-weight:700;color:var(--muted);font-size:13px}
.pick.sel{outline:4px solid var(--sun);outline-offset:-4px}
.flags-row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.flags-row img{height:26px;border-radius:5px;transform:rotate(var(--r));box-shadow:0 2px 4px rgba(30,42,74,.2)}

/* play */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.score{
  background:var(--sun);border-radius:999px;padding:8px 16px;font-weight:900;font-size:20px;
  box-shadow:0 4px 0 var(--sun-dark);display:flex;align-items:center;gap:6px;min-width:84px;justify-content:center;
}
.score.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.25) rotate(-6deg)}}
.prog{color:var(--muted);font-size:15px}
.bar{height:10px;background:rgba(255,255,255,.7);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:999px;transition:width .3s}
.exit{appearance:none;border:0;background:transparent;font:inherit;font-weight:900;color:var(--muted);cursor:pointer;padding:6px}

.card{
  background:var(--paper);border-radius:28px;padding:14px;
  box-shadow:0 12px 0 #C9DDF0, 0 20px 30px -20px rgba(30,42,74,.35);
  display:flex;flex-direction:column;align-items:center;gap:10px;
  transform:rotate(-1.5deg);
}
.card.in{animation:drop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-30px) rotate(3deg);opacity:0}}
.card img{width:100%;max-height:46vh;object-fit:contain;border-radius:14px;display:block;box-shadow:0 0 0 1px rgba(30,42,74,.12)}
.cont{font-size:15px;color:var(--muted);transform:rotate(1.5deg)}
.cont b{color:var(--ink)}

.opts{display:grid;gap:10px;grid-template-columns:1fr}
.opts.cols{grid-template-columns:1fr 1fr}
.opt{
  appearance:none;border:0;cursor:pointer;font:inherit;font-weight:900;color:var(--ink);
  background:var(--paper);border-radius:18px;padding:16px 12px;font-size:17px;min-height:58px;
  box-shadow:0 5px 0 #C9DDF0;transition:transform .12s,background .2s,color .2s,box-shadow .2s;
  line-height:1.15;
}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #C9DDF0}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok);color:#fff;box-shadow:0 5px 0 var(--ok-dark)}
.opt.no{background:var(--no);color:#fff;box-shadow:0 5px 0 var(--no-dark);animation:shake .4s}
.opt.glow{animation:glow .9s ease-in-out infinite alternate}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes glow{from{box-shadow:0 5px 0 var(--ok-dark),0 0 0 0 rgba(46,194,126,.6)}to{box-shadow:0 5px 0 var(--ok-dark),0 0 0 12px rgba(46,194,126,0)}}
.opt.dim{opacity:.45}

.next{
  appearance:none;border:0;cursor:pointer;font:inherit;font-weight:900;color:var(--ink);
  background:var(--sun);border-radius:999px;padding:16px;font-size:20px;box-shadow:0 6px 0 var(--sun-dark);
  visibility:hidden;transition:transform .12s;
}
.next.show{visibility:visible}
.next:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-dark)}
.hint{text-align:center;color:var(--muted);font-size:15px;min-height:20px;margin:0}

/* end */
.big{font-size:72px;text-align:center;line-height:1;margin:24px 0 0}
.final{text-align:center;font-size:20px;color:var(--muted);margin:0}
.final b{display:block;font-size:56px;color:var(--ink);line-height:1.1}
.ghost{appearance:none;border:0;background:transparent;font:inherit;font-weight:900;color:var(--muted);cursor:pointer;padding:12px;font-size:17px}

:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>

<!-- avvio -->
<section class="screen on" id="s-start">
  <h1>Indovina la <span>bandiera</span></h1>
  <div class="flags-row" id="deco"></div>
  <h2>Dove vuoi giocare?</h2>
  <div class="choices two">
    <button class="pick" data-area="world"><span class="ico">🌍</span>Tutto il mondo<small id="n-world"></small></button>
    <button class="pick" data-area="europe"><span class="ico">🏰</span>Solo Europa<small id="n-europe"></small></button>
  </div>
  <h2>Quanto vuoi faticare?</h2>
  <div class="choices">
    <button class="pick" data-lvl="2"><span class="ico">🙂</span>Facile<small>2 nomi · 1 punto a risposta</small></button>
    <button class="pick" data-lvl="4"><span class="ico">😎</span>Intermedio<small>4 nomi · 2 punti a risposta</small></button>
    <button class="pick" data-lvl="6"><span class="ico">🤯</span>Difficile<small>6 nomi · 3 punti a risposta</small></button>
  </div>
</section>

<!-- gioco -->
<section class="screen" id="s-play">
  <div class="top">
    <button class="exit" id="exit">✕ Esci</button>
    <span class="prog" id="prog"></span>
    <div class="score" id="score">⭐ 0</div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="card" id="card">
    <img id="flag" alt="Bandiera da indovinare">
    <div class="cont">Si trova in <b id="cont"></b></div>
  </div>
  <div class="opts" id="opts"></div>
  <p class="hint" id="hint"></p>
  <button class="next" id="next">Prossima bandiera →</button>
</section>

<!-- fine -->
<section class="screen" id="s-end">
  <p class="big" id="emoji">🏆</p>
  <h2>Hai finito!</h2>
  <p class="final"><b id="fscore">0</b>punti</p>
  <p class="sub" id="fdet"></p>
  <div class="choices">
    <button class="pick" id="again"><span class="ico">🔁</span>Gioca ancora</button>
    <button class="ghost" id="home">Cambia area o livello</button>
  </div>
</section>

</main>

const src = c => 'data:image/webp;base64,' + IMG[c];

const $ = id => document.getElementById(id);
const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a; };
const show = id => { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $(id).classList.add('on'); window.scrollTo(0,0); };

let area = null, lvl = null;
let pool=[], idx=0, score=0, hits=0;

// decorazione iniziale
$('n-world').textContent = DATA.length + ' bandiere';
$('n-europe').textContent = DATA.filter(c=>c.k==='Europa').length + ' bandiere';
shuffle(DATA.slice()).slice(0,7).forEach((c,i)=>{
  const im=document.createElement('img'); im.src=src(c.c); im.alt='';
  im.style.setProperty('--r',((i%2?1:-1)*(3+i*2))+'deg'); $('deco').appendChild(im);
});

document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{
  area=b.dataset.area; document.querySelectorAll('[data-area]').forEach(x=>x.classList.toggle('sel',x===b)); tryStart();
});
document.querySelectorAll('[data-lvl]').forEach(b=>b.onclick=()=>{
  lvl=+b.dataset.lvl; document.querySelectorAll('[data-lvl]').forEach(x=>x.classList.toggle('sel',x===b)); tryStart();
});
function tryStart(){ if(area&&lvl) setTimeout(start,180); }

function start(){
  pool = shuffle((area==='europe' ? DATA.filter(c=>c.k==='Europa') : DATA).slice());
  idx=0; score=0; hits=0;
  $('score').textContent='⭐ 0';
  show('s-play'); question();
}

const points = () => ({2:1,4:2,6:3})[lvl];

function question(){
  const c = pool[idx];
  $('prog').textContent = (idx+1)+' / '+pool.length;
  $('bar').style.width = (idx/pool.length*100)+'%';
  $('flag').src = src(c.c);
  $('cont').textContent = c.k;
  $('hint').textContent=''; $('next').classList.remove('show');
  const card=$('card'); card.classList.remove('in'); void card.offsetWidth; card.classList.add('in');

  // distrattori: prima dello stesso continente, poi dagli altri
  const same = shuffle(DATA.filter(x=>x.k===c.k && x.c!==c.c));
  const other = shuffle(DATA.filter(x=>x.k!==c.k));
  const opts = shuffle([c, ...same.concat(other).slice(0,lvl-1)]);

  const box=$('opts'); box.innerHTML=''; box.classList.toggle('cols', lvl>2);
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=o.n;
    b.onclick=()=>answer(b,o,c); box.appendChild(b);
  });
}

function answer(btn,o,c){
  const all=[...$('opts').children]; all.forEach(b=>b.disabled=true);
  if(o.c===c.c){
    btn.classList.add('ok'); score+=points(); hits++;
    const s=$('score'); s.textContent='⭐ '+score; s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump');
    $('hint').textContent=['Bravissimo!','Esatto!','Grande!','Perfetto!'][Math.random()*4|0]+' +'+points();
  }else{
    btn.classList.add('no');
    all.forEach(b=>{ if(b.textContent===c.n) b.classList.add('ok','glow'); else if(b!==btn) b.classList.add('dim'); });
    $('hint').textContent='Era '+c.n+'. Alla prossima!';
  }
  $('next').classList.add('show'); $('next').focus({preventScroll:true});
}

$('next').onclick=()=>{ idx++; if(idx>=pool.length) end(); else question(); };
$('exit').onclick=()=>{ if(idx===0&&score===0) show('s-start'); else end(); };

function end(){
  const done = Math.min(idx+1,pool.length);
  $('fscore').textContent=score;
  $('fdet').textContent=hits+' bandiere indovinate su '+done;
  const r = done? hits/done : 0;
  $('emoji').textContent = r>=.9?'🏆':r>=.6?'🎉':r>=.3?'👍':'🌱';
  $('bar').style.width='100%';
  show('s-end');
}
$('again').onclick=start;
$('home').onclick=()=>{ area=lvl=null; document.querySelectorAll('.pick.sel').forEach(x=>x.classList.remove('sel')); show('s-start'); };
</script>
</body>
</html>
